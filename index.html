function render(){let c=$('content');if(activeLesson){renderLesson(c);return}if(activePath){renderPath(c);return}if(page==='Learning Paths'||page==='Dashboard'){let ps=paths.filter(p=>(filter==='All Paths'||p.level===filter)&&(!search||(p.title+' '+p.category+' '+p.desc).toLowerCase().includes(search.toLowerCase())));c.innerHTML=`<div class="hero"><div><div class="eyebrow">${page==='Dashboard'?'Command center':'Learning paths'}</div><h1>${page==='Dashboard'?'Train like a defender.':'Build Your Cybersecurity Skills'}</h1><p>Structured learning paths built around practical security skills. Learn the concepts, test your understanding, and apply what you know in guided labs.</p></div><div class="hero-stat"><div class="tiny">YOUR LEARNING ACTIVITY</div><strong>42% <span style="font-size:12px">↗</span></strong><div class="tiny">Overall progress · +8% this week</div></div></div>${page==='Dashboard'?`<div class="sectionhead"><div><h2>Pick up where you left off</h2><p>Your next recommended lesson is ready.</p></div></div><div class="panel continue"><div class="courseicon">◈</div><div><div class="eyebrow">Recommended next</div><h3>Cybersecurity Fundamentals</h3><p>Lesson 7 · Authentication vs. authorization · 12 min</p></div><span class="push"></span><button class="primary" style="width:auto" onclick="openPath('fundamentals')">Continue lesson　›</button></div><div class="sectionhead"><div><h2>Explore learning paths</h2><p>Choose a path or switch difficulty to find your next challenge.</p></div></div>`:''}<div class="filters">${['All Paths','Beginner','Intermediate','Advanced'].map(f=>`<button class="pill ${filter===f?'active':''}" onclick="filter='${f}';render()">${f}</button>`).join('')}<span class="push"></span><span class="tiny">${ps.length} paths available</span></div><div class="grid">${ps.map(card).join('')||'<div class="panel">No paths match your search. Try a different keyword.</div>'}</div><div class="sectionhead"><div><h2>Learn by doing</h2><p>Short practice activities to reinforce the theory.</p></div></div><div class="twocol"><div class="panel challenge"><div class="courseicon">⚡</div><div><div class="eyebrow">Daily challenge</div><h3>Spot the phishing clues</h3><div class="tiny">5 questions · about 6 minutes · +50 XP</div></div><span class="push"></span><button class="textbtn" onclick="setPage('Challenges')">Start ›</button></div><div class="panel challenge"><div class="courseicon">⌘</div><div><div class="eyebrow">Hands-on practice</div><h3>Cyber Range: Log investigation</h3><div class="tiny">Guided simulation · beginner friendly</div></div><span class="push"></span><button class="textbtn" onclick="setPage('Cyber Range')">Enter ›</button></div></div>`;return}renderOther(c)}
function openPath(id){activePath=paths.find(p=>p.id===id);expandedUnits={0:true};activeLesson=null;render();window.scrollTo(0,0)}function renderPath(c){let p=activePath,pr=progress(p);let total=p.units.reduce((n,u)=>n+u[2].length,0),done=p.units.reduce((n,u,ui)=>n+u[2].filter((l,li)=>completed.has(p.id+'-'+ui+'-'+li)).length,0);c.innerHTML=`<div class="pathhead"><button class="back" onclick="activePath=null;render()">← All paths</button><div style="flex:1"><div class="eyebrow">${p.category} / ${p.level}</div><h1>${p.title}</h1><p>${p.desc} Work through each unit, check your understanding, and use the practical exercises to turn knowledge into skill.</p><div class="pathstats"><span>▤ ${p.units.length} units</span><span>▣ ${total} lessons</span><span>◷ ${p.time}</span><span>⚑ ${p.labs} practical labs</span></div></div></div><div class="twocol"><div class="panel"><div class="eyebrow">Your course progress</div><div style="display:flex;align-items:center;gap:12px;margin:10px 0"><strong style="font-size:28px;color:var(--teal)">${pr}%</strong><span class="tiny">${done} of ${total} lessons completed</span></div><div class="meter" style="height:7px"><i style="width:${pr}%"></i></div><p class="tiny" style="margin-bottom:0">Finish a lesson to save your progress in this preview.</p></div><div class="panel"><div class="eyebrow">Suggested next step</div><h3 style="margin:8px 0">${nextLesson(p)||'Course complete'}</h3><p class="tiny">Lessons are organized from core concepts to applied scenarios.</p><button class="primary" onclick="startNext()">${done?'Continue learning':'Start first lesson'}　›</button></div></div><div class="sectionhead"><div><h2>Course curriculum</h2><p>Open a unit to see its lessons and activities.</p></div><span class="tiny">${p.units.length} units</span></div><div class="unitlist">${p.units.map((u,ui)=>`<section class="unit"><div class="unithead" onclick="expandedUnits[${ui}]=!expandedUnits[${ui}];render()"><div class="unitnum">${String(ui+1).padStart(2,'0')}</div><div><h3>${u[0]}</h3><p>${u[1]} · ${u[2].length} lessons</p></div><span class="push"></span><span class="tiny">${u[2].filter((l,li)=>completed.has(p.id+'-'+ui+'-'+li)).length}/${u[2].length} complete　${expandedUnits[ui]?'−':'+'}</span></div>${expandedUnits[ui]?`<div class="lessonlist">${u[2].map((l,li)=>`<div class="lesson" onclick="openLesson(${ui},${li})"><span class="check">${completed.has(p.id+'-'+ui+'-'+li)?'✓':'○'}</span><span>${l}</span><span class="duration">${li===u[2].length-1?'Knowledge check':'8–12 min'}</span><span>›</span></div>`).join('')}</div>`:''}</section>`).join('')}</div><div class="callout">Learning tip: explain each concept in your own words, then connect it to an example from a real system. Practice activities in this preview are simulations, not live security tools.</div>`}function nextLesson(p){for(let ui=0;ui<p.units.length;ui++)for(let li=0;li<p.units[ui][2].length;li++)if(!completed.has(p.id+'-'+ui+'-'+li))return p.units[ui][2][li];return ''}function startNext(){let p=activePath;for(let ui=0;ui<p.units.length;ui++)for(let li=0;li<p.units[ui][2].length;li++)if(!completed.has(p.id+'-'+ui+'-'+li)){openLesson(ui,li);return}}function openLesson(ui,li){activeLesson={ui,li};quizChoice=-1;quizChecked=false;render();window.scrollTo(0,0)}
function renderLesson(c){let p=activePath,{ui,li}=activeLesson,title=p.units[ui][2][li],isQuiz=/check|assessment|exercise|lab|review|scenario/i.test(title),done=completed.has(p.id+'-'+ui+'-'+li);c.innerHTML=`<div class="lessonview"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px"><button class="back" onclick="activeLesson=null;render()">← Course curriculum</button><span class="tiny">UNIT ${ui+1} / ${p.units.length}　·　LESSON ${li+1}</span></div><div class="eyebrow">${p.title}</div><h1 style="font-size:30px;margin:8px 0 5px">${title}</h1><p style="color:var(--muted);margin-top:0">${isQuiz?'Apply the ideas from this unit and check your understanding.':'Learn the core idea, see how it applies, then test yourself.'}</p><div class="meter" style="height:5px;margin:20px 0"><i style="width:${Math.round((li+1)/p.units[ui][2].length*100)}%"></i></div><div class="panel lessonbody">${isQuiz?quizMarkup():lessonMarkup(title,p,ui,li)}<div id="feedback"></div><div style="display:flex;justify-content:space-between;gap:12px;margin-top:24px"><button class="back" onclick="activeLesson=null;render()">Back to units</button><button class="primary" style="width:auto;padding:11px 20px" onclick="completeLesson()">${done?'Completed ✓':'Mark lesson complete'}　→</button></div></div><p class="tiny" style="margin-top:14px">Learning reference: <a style="color:var(--teal)" href="https://www.nist.gov/cyberframework" target="_blank" rel="noreferrer">NIST Cybersecurity Framework</a> · <a style="color:var(--teal)" href="https://attack.mitre.org/" target="_blank" rel="noreferrer">MITRE ATT&CK</a></p></div>`}function lessonMarkup(title,p,ui,li){return `<p><strong>Why this matters</strong></p><p>${title} is part of a practical security workflow: understand what you are protecting, identify what can go wrong, and choose controls that reduce the likelihood or impact of harm. Good security work combines technical evidence with clear reasoning and careful documentation.</p><h2>Key ideas</h2><ul><li><strong>Define the context.</strong> Identify the system, the data it handles, and the people who depend on it.</li><li><strong>Look for evidence.</strong> Use logs, configuration, observed behavior, and documented requirements rather than assumptions.</li><li><strong>Reduce risk proportionately.</strong> Apply controls that address the actual exposure while preserving legitimate use.</li><li><strong>Verify the result.</strong> Record what changed and confirm that the intended protection works.</li></ul><div class="callout"><strong>Field note</strong><br>Security findings should be reproducible. Record the time, relevant system or artifact, observed behavior, and why it matters. Avoid collecting sensitive data that is not needed.</div><h2>Worked example</h2><p>A team notices repeated failed sign-ins followed by a successful login from an unfamiliar location. A careful investigation checks identity logs, verifies whether the user was traveling, reviews MFA events, and documents the conclusion before taking proportionate action.</p><div class="code">Observation → Gather evidence → Form hypothesis<br>→ Validate safely → Mitigate risk → Document</div><h2>Check your understanding</h2><p>Before moving on, try to explain the main concept in one or two sentences. Then consider how you would apply it to a small business with limited security staff.</p>`}function quizMarkup(){return `<div class="eyebrow">Knowledge check · scenario</div><h2 style="margin-top:8px">A teammate receives an email asking them to urgently sign in through a link to avoid account suspension. What is the safest first action?</h2><p>Choose the best response based on the evidence available.</p>${['Open the link in a private browser window to see where it goes.','Report the message through the approved process and verify the request through a known, separate channel.','Forward the email to coworkers and ask whether it looks legitimate.','Reply to the sender asking them to confirm their identity.'].map((a,i)=>`<button class="answer ${quizChoice===i?'chosen':''}" onclick="quizChoice=${i};render()">${String.fromCharCode(65+i)}.　${a}</button>`).join('')}<button class="primary" style="margin-top:8px" onclick="checkQuiz()">Check answer</button>`}function checkQuiz(){if(quizChoice<0){$('feedback').innerHTML='<div class="callout">Choose an answer first.</div>';return}let ok=quizChoice===1;$('feedback').innerHTML=`<div class="feedback" style="background:${ok?'#10372f':'#3a2b16'};color:${ok?'#b6f4da':'#ffdfa4'}"><strong>${ok?'Correct — good security practice.':'Not quite. Review the safest response.'}</strong><br>Report it and verify the request using a known, separate channel. Do not follow the link or reply to the sender. This reduces the chance of credential theft and preserves the message for investigation.</div>`;quizChecked=ok}function completeLesson(){let {ui,li}=activeLesson;completed.add(activePath.id+'-'+ui+'-'+li);if(!completed.size===false)$('overall').textContent=Math.min(99,42+Math.floor(completed.size/3))+'%';activeLesson=null;render()}
function renderOther(c){const data={Challenges:['Challenges & skill checks','Short scenarios that test judgment, pattern recognition, and safe decision-making.'], 'Battle Arena':['Battle Arena','Compete against scenario prompts and compare your reasoning with the recommended defensive response.'],'Cyber Range':['Cyber Range','Practice in guided, simulated environments. No real systems are targeted by this preview.'],'Resources':['Resource library','Trusted references for going deeper after each lesson.'],'Community':['Community & study groups','Share learning notes, join study groups, and discuss defensive security practice.']};let [h,sub]=data[page]||data.Resources;if(page==='Resources'){c.innerHTML=`<div class="hero"><div><div class="eyebrow">Knowledge base</div><h1>${h}</h1><p>${sub}</p></div></div><div class="resourcegrid">${[['NIST Cybersecurity Framework','A practical structure for understanding and managing cybersecurity risk.','https://www.nist.gov/cyberframework'],['OWASP Web Security Testing Guide','A detailed guide for testing web application security.','https://owasp.org/www-project-web-security-testing-guide/'],['MITRE ATT&CK','A knowledge base of adversary tactics and techniques.','https://attack.mitre.org/'],['CISA Cybersecurity Guidance','Practical security guidance and resources for organizations.','https://www.cisa.gov/'],['NIST NICE Framework','Cybersecurity work roles, skills, and learning pathways.','https://www.nist.gov/itl/applied-cybersecurity/nice/nice-framework-resource-center'],['Linux Documentation Project','References for learning Linux concepts and administration.','https://tldp.org/']].map(r=>`<article class="resource"><div class="courseicon">↗</div><h3>${r[0]}</h3><p>${r[1]}</p><a href="${r[2]}" target="_blank" rel="noreferrer">Open resource ↗</a></article>`).join('')}</div>`;return}if(page==='Challenges'){c.innerHTML=`<div class="hero"><div><div class="eyebrow">Practice & assessment</div><h1>${h}</h1><p>${sub}</p></div></div><div class="grid">${[['Daily challenge','Spot the phishing clues','5 questions · 6 min · Beginner','⚡'],['Incident triage','Prioritize a suspicious endpoint alert','8 decisions · 12 min · Intermediate','⬡'],['Threat intelligence','Map observed behavior to ATT&CK','6 questions · 10 min · Advanced','◎']].map(x=>`<article class="course"><div class="coursehead"><div class="courseicon">${x[3]}</div><div class="tag">PRACTICE</div></div><h3>${x[1]}</h3><p>${x[0]} built around realistic defensive decisions and explanations.</p><div class="meta">${x[2]}</div><button class="primary" onclick="startChallenge('${x[1]}')">Start challenge　›</button></article>`).join('')}</div><div id="challengeArea"></div>`;return}if(page==='Cyber Range'){c.innerHTML=`<div class="hero"><div><div class="eyebrow">Hands-on lab environment</div><h1>${h}</h1><p>${sub}</p></div></div><div class="grid">${[['Log Investigation','Identify a suspicious login from sample authentication logs.','Beginner','▤'],['Web Request Review','Review a sanitized HTTP request and identify security concerns.','Intermediate','‹/›'],['Incident Timeline','Correlate simulated endpoint events into a timeline.','Advanced','⌚']].map(x=>`<article class="course"><div class="coursehead"><div class="courseicon">${x[3]}</div><div class="tag">SIMULATED LAB</div></div><h3>${x[0]}</h3><p>${x[1]}</p><span class="level ${x[2]}">${x[2]}</span><div class="meta">Guided · 10–20 min · Safe sandbox</div><button class="primary" onclick="startLab('${x[0]}')">Open lab　›</button></article>`).join('')}</div><div id="challengeArea"></div>`;return}if(page==='Battle Arena'){c.innerHTML=`<div class="hero"><div><div class="eyebrow">Decision arena</div><h1>${h}</h1><p>${sub}</p></div></div><div class="panel" style="max-width:780px;margin:auto"><div class="eyebrow">Scenario 01 · Blue team</div><h2>A workstation is contacting a newly registered domain every 60 seconds. What should you do first?</h2><p class="tiny">Think like an analyst: preserve evidence and scope the issue before taking disruptive action.</p>${['Immediately wipe the workstation.','Review endpoint and DNS telemetry, validate the alert, and scope related activity.','Block every external domain across the company.','Ignore it until a user reports a problem.'].map((a,i)=>`<button class="answer" onclick="this.parentElement.querySelectorAll('.answer').forEach(b=>b.style.borderColor='#204353');this.style.borderColor='var(--teal)';document.getElementById('arenaFeedback').innerHTML='<div class=callout>'+('B. Review endpoint and DNS telemetry, validate the alert, and scope related activity.'.startsWith(this.textContent.slice(3,4))?'Correct. Validate and scope the activity while preserving evidence.':'Review the evidence-first response: validate the alert and scope related activity before choosing containment.')+'</div>'">${String.fromCharCode(65+i)}. ${a}</button>`).join('')}<div id="arenaFeedback"></div></div>`;return}c.innerHTML=`<div class="hero"><div><div class="eyebrow">${page}</div><h1>${h}</h1><p>${sub}</p></div></div><div class="twocol"><div class="panel"><div class="eyebrow">Study group</div><h3>Blue Team Foundations</h3><p class="tiny">Discuss alert triage, detection logic, and incident response workflows.</p><button class="primary" onclick="alert('Preview: group joining will be connected when accounts and backend are enabled.')">View study group</button></div><div class="panel"><div class="eyebrow">Recent discussion</div><div class="communitypost"><b>How do you keep incident notes useful?</b><p class="tiny">6 replies · Incident Response</p></div><div class="communitypost"><b>Beginner-friendly packet analysis tips</b><p class="tiny">12 replies · Network Defense</p></div></div></div>`}
function startChallenge(name){$('challengeArea').innerHTML=`<div class="panel" style="margin-top:20px"><div class="eyebrow">Challenge started</div><h2>${name}</h2><p>Which action best preserves evidence and reduces risk?</p><button class="answer" onclick="this.style.borderColor='var(--teal)';this.insertAdjacentHTML('afterend','<div class=feedback>Correct approach: use the approved reporting process, verify with trusted evidence, and document the result.</div>')">Report and verify through a trusted process</button><button class="answer" onclick="this.style.borderColor='#ffb25b';this.insertAdjacentHTML('afterend','<div class=callout>Try again: avoid taking action that may expose credentials or destroy evidence.</div>')">Click the suspicious link to test it</button></div>`}function startLab(name){$('challengeArea').innerHTML=`<div class="panel" style="margin-top:20px"><div class="eyebrow">Sandbox simulation · ${name}</div><h2>Sample event log</h2><div class="code">09:14:02 AUTH_FAIL user=jsmith src=203.0.113.42<br>09:14:08 AUTH_FAIL user=jsmith src=203.0.113.42<br>09:14:13 MFA_DENY user=jsmith src=203.0.113.42<br>09:15:01 AUTH_SUCCESS user=jsmith src=203.0.113.42</div><p>What is the strongest next step?</p><button class="answer" onclick="this.insertAdjacentHTML('afterend','<div class=feedback>Good. Preserve the relevant logs, verify the sign-in with the user through a trusted channel, and review session activity before choosing containment.</div>')">Correlate sign-in and MFA events, then verify the activity and scope the session.</button><button class="answer" onclick="this.insertAdjacentHTML('afterend','<div class=callout>Consider validating the event and scoping its impact before making a disruptive change.</div>')">Delete the logs to stop the alerts.</button></div>`}render();
</script></body></html>
